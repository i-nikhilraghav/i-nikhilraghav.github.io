<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nikhil Raghav - Digital Portfolio</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>

        :root {

            --bg-color: #0b0b0d;

            --card-bg: #131317;

            --accent-orange: #ff4500;

            --accent-glow: rgba(255, 69, 0, 0.4);

            --text-white: #ffffff;

            --text-muted: #a0a0a8;

            --pill-border: rgba(255, 255, 255, 0.15);

        }


        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;

        }


        body {

            font-family: 'Plus Jakarta Sans', sans-serif;

            background-color: var(--bg-color);

            color: var(--text-white);

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow-x: hidden;

            padding: 20px;

        }


        .container {

            position: relative;

            width: 100%;

            max-width: 900px;

            min-height: 1000px;

            background: radial-gradient(circle at 50% 35%, #1a1a24 0%, var(--bg-color) 70%);

            border-radius: 24px;

            overflow: hidden;

            padding: 40px 20px;

            display: flex;

            flex-direction: column;

            justify-content: space-between;

            align-items: center;

            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);

            border: 1px solid rgba(255, 255, 255, 0.05);

        }


        /* Top Header */

        .top-heading {

            font-size: 5rem;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 2px;

            color: #f2efe9;

            z-index: 3;

            margin-top: 10px;

        }


        /* Curved Arrow Line Overlay */

        .svg-overlay {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            pointer-events: none;

            z-index: 2;  /* behind portrait (3), behind tags (4) */

        }


        /* Central Portrait Styling */

        .portrait-wrapper {

            position: absolute;

            top: 120px;

            width: 100%;

            max-width: 460px;

            height: 700px;

            display: flex;

            justify-content: center;

            z-index: 3;  /* in FRONT of SVG line (2), behind tags (4) */

        }


        .portrait-img {

            width: 100%;

            height: 100%;

            object-fit: cover;

            object-position: top;

            filter: grayscale(100%) contrast(110%);

            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 75%, rgba(0,0,0,0) 100%);

            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 75%, rgba(0,0,0,0) 100%);

        }


        /* Floating Tags / Badges */

        .tag {

            position: absolute;

            z-index: 4;

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 10px 22px;

            background: rgba(18, 18, 20, 0.85);

            border: 1px solid var(--pill-border);

            border-radius: 50px;

            backdrop-filter: blur(8px);

            font-size: 0.95rem;

            font-weight: 600;

            color: #ffffff;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);

            transition: transform 0.3s ease, border-color 0.3s ease;

        }


        .tag:hover {

            transform: translateY(-3px);

            border-color: var(--accent-orange);

        }


        .tag::before {

            content: '';

            display: inline-block;

            width: 8px;

            height: 14px;

            background: linear-gradient(135deg, #ff7700, var(--accent-orange));

            border-radius: 4px;

            box-shadow: 0 0 10px var(--accent-orange);

        }


        /* Tag Positions */

        .tag-it { top: 220px; right: 10%; }

        .tag-web { top: 380px; left: 8%; }

        .tag-sys { top: 530px; right: 8%; }

        .tag-net { top: 660px; left: 6%; }

        .tag-tech { top: 760px; right: 12%; }


        /* Main Name Display */

        .hero-title-container {

            position: absolute;

            bottom: 60px;

            left: 7%;

            z-index: 3;

            text-align: left;

        }


        .hero-title-sub {

            font-size: 4rem;

            font-weight: 800;

            line-height: 0.9;

            color: var(--text-white);

            display: block;

        }


        .hero-title-main {

            font-size: 5.5rem;

            font-weight: 800;

            line-height: 0.95;

            color: var(--accent-orange);

            display: block;

            text-shadow: 0 0 30px rgba(255, 69, 0, 0.3);

            text-transform: uppercase;

        }


        /* Footer Call-to-Action */

        .cta-container {

            position: absolute;

            bottom: 70px;

            right: 7%;

            z-index: 3;

            text-align: right;

        }


        .cta-link {

            display: inline-flex;

            align-items: center;

            gap: 12px;

            color: var(--text-white);

            text-decoration: none;

            font-size: 1.15rem;

            font-weight: 600;

            transition: color 0.3s ease, transform 0.3s ease;

        }


        .cta-link:hover {

            color: var(--accent-orange);

            transform: translateX(5px);

        }


        .cta-arrow {

            font-size: 1.5rem;

            color: var(--accent-orange);

        }


        /* Mobile Optimization */

        @media (max-width: 768px) {

            .container { min-height: 850px; }

            .top-heading { font-size: 3.5rem; }

            .hero-title-sub { font-size: 2.8rem; }

            .hero-title-main { font-size: 3.8rem; }

            .tag { padding: 8px 16px; font-size: 0.8rem; }

            .tag-it { top: 180px; right: 4%; }

            .tag-web { top: 320px; left: 4%; }

            .tag-sys { top: 460px; right: 4%; }

            .tag-net { top: 580px; left: 4%; }

            .tag-tech { top: 680px; right: 4%; }

            .hero-title-container { bottom: 110px; left: 5%; }

            .cta-container { bottom: 40px; right: 5%; left: 5%; text-align: left; }

        }

    </style>

</head>

<body>


    <div class="container">

