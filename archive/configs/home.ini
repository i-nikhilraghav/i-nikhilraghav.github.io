                C 260 392, 170 388, 130 400

                C 100 410, 98 425, 115 438

                C 140 455, 200 445, 270 465

                C 380 495, 510 530, 620 555

                C 710 575, 780 578, 800 595

                C 820 612, 800 628, 775 632

